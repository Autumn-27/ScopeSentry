apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mongodb
  namespace: scope-sentry

spec:
  serviceName: mongodb
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:7.0.28

          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD

          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db

volumeClaimTemplates:
  - metadata:
      name: mongodb-data

    spec:
      accessModes:
        - ReadWriteOnce

      resources:
        requests:
          storage: 20Gi

name: CI

# 跑在自建 runner 上（dev-tx-sh-app-01），与 ARTEX 同一台机器、独立 runner 进程。
# 触发器：PR / push main / 手动。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  go:
    name: Go build / vet / hermetic tests
    runs-on: [self-hosted, linux, x64, scopesentry-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 必须装与 go.mod toolchain 完全一致的版本：
      # 只装 1.24.0 时 Go 会去 proxy.golang.org 拉 1.24.6，而这台机器没有 IPv6 路由
      # （proxy.golang.org 又在 no_proxy 里，绕过了代理），会直接失败。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          # 自建 runner 的 ~/go/pkg/mod 本来就常驻；再把整个模块缓存传到 Actions
          # cache 里要几分钟，收益为负，直接关掉
          cache: false

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化（本地跑 make fmt）:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy check
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # 国内机器直连 proxy.golang.org 会卡住（IPv6 无路由 / 限速），
      # 用 goproxy.cn；它不在 no_proxy 里时也会被 runner 代理转发
      - name: go build
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: go build ./...

      # 只跑不依赖 Mongo/Redis 的叶子包；依赖 bootstrap 的包在 init 阶段就会连库
      - name: go test (hermetic packages)
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: |
          go test -count=1 -coverprofile=coverage.out \
            ./internal/services/task/tasksync/ \
            ./internal/services/task/taskstate/ \
            ./internal/services/task/audit/ \
            ./internal/api/routes/audit/ \
            ./internal/repositories/plugin/ \
            ./internal/services/project/ \
            ./internal/api/handlers/sensitiveRule/ \
            ./internal/api/middleware/compress/ \
            ./internal/api/handlers/health/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

      - name: go vet (本次维护的包)
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: |
          go vet \
            ./internal/api/handlers/task/ \
            ./internal/api/routes/task/ \
            ./internal/services/task/... \
            ./internal/repositories/plugin/

  frontend:
    name: Frontend build / locale / theme checks
    runs-on: [self-hosted, linux, x64, scopesentry-ci]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.1 --activate
          pnpm -v

      # 自建 runner 的 pnpm store 常驻 ~/.local/share/pnpm/store，
      # 再上传到 Actions cache 既慢又容易在 post 步骤被取消（会让 job 判失败）
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Build (mode=pro)
        run: pnpm build:pro

      - name: ESLint
        run: npx eslint --ext .js,.ts,.vue ./src --max-warnings 0

      - name: Locale parity (en / zh-CN / ko-KR)
        run: node scripts/check-locales.mjs

      - name: Theme tri-state self-check
        run: npx esno ./scripts/check-theme.ts

      # 历史遗留类型错误较多，先只告警不阻断，避免 CI 一上来就红
      - name: vue-tsc (non-blocking)
        continue-on-error: true
        run: npx vue-tsc --noEmit --skipLibCheck

  # 真实依赖下的全量测试：临时起 Mongo + Redis，随机端口，跑 go test ./...
  integration:
    name: Integration (Mongo + Redis)
    runs-on: [self-hosted, linux, x64, scopesentry-ci]
    timeout-minutes: 30
    env:
      MONGODB_IP: 127.0.0.1
      MONGODB_DATABASE: ScopeSentryCI
      MONGODB_USER: ciadmin
      MONGODB_PASSWORD: cipassword
      REDIS_IP: 127.0.0.1
      REDIS_PASSWORD: ciredis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false

      - name: Start Mongo + Redis
        run: |
          set -euo pipefail
          MONGO="ci-mongo-${{ github.run_id }}"
          REDIS="ci-redis-${{ github.run_id }}"
          docker rm -f "$MONGO" "$REDIS" >/dev/null 2>&1 || true

          docker run -d --name "$MONGO" -p 0:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=ciadmin \
            -e MONGO_INITDB_ROOT_PASSWORD=cipassword \
            mongo:7.0.28
          docker run -d --name "$REDIS" -p 0:6379 \
            redis:7.0.11 redis-server --requirepass ciredis

          MPORT=$(docker port "$MONGO" 27017/tcp | head -1 | awk -F: '{print $NF}')
          RPORT=$(docker port "$REDIS" 6379/tcp | head -1 | awk -F: '{print $NF}')
          echo "MONGODB_PORT=$MPORT" >> "$GITHUB_ENV"
          echo "REDIS_PORT=$RPORT" >> "$GITHUB_ENV"

          for i in $(seq 1 60); do
            if docker exec "$MONGO" mongosh -u ciadmin -p cipassword --authenticationDatabase admin --quiet \
              --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 2
          done

          docker exec "$REDIS" redis-cli -a ciredis ping | grep -q PONG
          echo "mongo:$MPORT redis:$RPORT ready"

      # 先跑一个包把空库初始化一次（bootstrap 的 init 会 CreateDatabase），
      # 否则 go test 并行启多个测试二进制会在首启初始化上互相踩踏
      - name: warm up database
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: go test -count=1 ./internal/services/project/

      - name: go test ./...
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: go test -count=1 ./...

      - name: Cleanup dependencies
        if: always()
        run: |
          docker rm -f "ci-mongo-${{ github.run_id }}" "ci-redis-${{ github.run_id }}" || true
